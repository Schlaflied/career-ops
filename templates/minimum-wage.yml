# Career-Ops — Minimum-Wage Reference Data (jurisdiction table) (#2025)
#
# Consumed prompt-level by modes/oferta.md Block G ("Minimum-Wage Floor
# Check"). This file is a DATA REFERENCE, not instruction logic: extending it
# to a new jurisdiction never requires touching the rule text in
# modes/oferta.md. No PRODUCTION script reads it — nothing in the runtime
# pipeline (scan.mjs, apply flows, tracker writes, etc.) parses this file.
# The agent consumes it as prompt-level reference text, and test-all.mjs
# DOES validate its structure and header contract as part of the test suite
# — "no script reads it" describes the runtime pipeline only, not CI.
#
# NON-AUTHORITATIVE (mandatory framing — read before editing or citing this
# file): the rates below are NOT a verified, current, legally authoritative
# statement of any jurisdiction's minimum wage. They are public reference
# figures compiled from the sources cited per row — useful for comparison
# arithmetic and for flagging that an advertised figure looks unusually low
# relative to public data, and NOTHING MORE. They are never, on their own,
# sufficient to assert what the CURRENT legal minimum wage is, or that any
# employer is or isn't complying with it. Every comparison rendered from
# this table in modes/oferta.md must route the candidate to "[ask your
# lawyer]" or an official government source to confirm the actual current
# statutory rate — this table supports that question, it never replaces it.
#
# CONTRIBUTION RULE (mandatory): no entry lands in this table without
#   1. a citable legal source (statute, regulation, official government
#      announcement, or a reputable law-firm bulletin summarizing it), AND
#   2. an explicit effective date for every rate carried, AND
#   3. an `as_of` date recording when the row was last verified.
# Unverified or "I heard that..." rows will be rejected in review. Seed
# narrow and verified; extend via community PRs — same discipline as the
# jurisdiction tables introduced for #2013/#2018/#2019.
#
# STALENESS RULE (mandatory — mirrored in modes/oferta.md): minimum wages
# change annually almost everywhere, and as reference data (not a live feed)
# every row can drift out of date regardless of whether a `next_rate` was
# ever pre-announced. A uniform 12-month freshness threshold applies to
# EVERY row, including rows with no `next_effective`: if today's date is
# more than 12 months past `as_of`, the row is review-due — the agent must
# treat it as tentative reference data at best. Date-aware rate selection
# ALWAYS runs first: use `general_rate` while today is before
# `next_effective`; use `next_rate` once today is on or after
# `next_effective` — an arrived `next_effective` date means `next_rate` is
# now the officially confirmed, in-force rate, never a sign of staleness.
# The 12-month review-due gate only matters when today is still before
# `next_effective` (or there is no `next_effective` at all), because in
# that case `general_rate` is the sole rate covering today and it is the
# one that can have gone stale: skip the comparison entirely ONLY when no
# rate actually covers today — i.e. the row is review-due under the
# 12-month gate AND (there is no `next_rate` at all, OR `next_rate` exists
# but its `next_effective` date has not arrived yet, leaving nothing but
# the stale `general_rate` to compare against) — rather than presenting
# stale reference data as current. A row with an already-arrived
# `next_effective` is NEVER skipped as stale on that basis alone: `next_rate`
# is by definition the rate covering today.
#
# NOT LEGAL ADVICE: these rows are non-authoritative reference figures so
# the agent can state observable, caveated arithmetic about a posting's
# advertised compensation relative to public data. They are never a basis
# for asserting the current legal minimum wage as fact, or that any employer
# is violating any law — special-rate carve-outs, exemptions, and posting
# provenance are not verifiable from a JD, and the current statutory rate is
# not verifiable from this table alone.
#
# Schema per entry (key = jurisdiction code, e.g. CA-ON, US-CA, DE):
#   jurisdiction_name: string — human-readable name for report output
#   general_rate: number      — non-authoritative reference rate for the
#                               general minimum wage (per hour) as of `as_of`
#   currency: ISO 4217 code
#   effective: YYYY-MM-DD     — date general_rate came into force
#   next_rate: number|null    — officially announced next rate, if any
#   next_effective: YYYY-MM-DD|null — date next_rate comes into force
#   special_rates: list       — INFORMATIONAL carve-outs (students, homeworkers,
#                               tipped workers, ...) so the agent names the
#                               applicable special rate instead of false-flagging
#                               against the general floor
#   legal_basis: string       — statute/regulation citation + indexation rule
#   sources: list             — citable announcements/bulletins backing the row
#   as_of: YYYY-MM-DD         — date this row was last verified against sources
#
# CANDIDATE ROWS FOR CONTRIBUTORS (suggestions only — do NOT add without the
# source + effective-date + as_of discipline above):
#   - CA-BC / CA-AB / CA-QC : other Canadian provinces (annual indexation varies)
#   - US federal + states   : federal $7.25 floor vs. state/city rates (many
#                             cities exceed states — key at the finest verified level)
#   - UK                    : National Living Wage / National Minimum Wage age bands
#   - DE / FR / EU          : Mindestlohn, SMIC, and other EU statutory minimums
#   - AU / NZ / JP          : national or prefectural minimum-wage systems

jurisdictions:
  CA-ON:
    jurisdiction_name: "Ontario, Canada"
    general_rate: 17.60            # CAD per hour
    currency: CAD
    effective: "2025-10-01"
    next_rate: 17.95               # officially announced 2026-04-01 by the Ontario Ministry of Labour
    next_effective: "2026-10-01"
    special_rates:                 # informational — see carve-out honesty rule in modes/oferta.md
      - "Student under 18 (and working ≤28 hrs/week during school, or during holidays): $16.60/hr, rising to $16.90/hr on 2026-10-01"
      - "Homeworkers (paid work done in the worker's own home): $19.35/hr, rising to $19.70/hr on 2026-10-01"
    legal_basis: "Ontario Employment Standards Act, 2000 — general minimum wage, CPI-indexed annually each October 1"
    sources:
      - "Ontario Ministry of Labour — minimum-wage increase announcement (2026-04-01)"
      - "Hicks Morley — Ontario minimum-wage rates bulletin (2026-04-01)"
      - "Monkhouse Law — Ontario minimum-wage rate table"
      - "CFIB — Canadian minimum-wage rate table"
    as_of: "2026-07-18"
