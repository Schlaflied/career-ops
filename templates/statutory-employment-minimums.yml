# Career-Ops — Statutory Employment-Minimums Category Flags (jurisdiction table) (#2039)
#
# Consumed prompt-level by modes/offer-prep.md ("Statutory-context notes for
# sub-statutory terms"). This file is a DATA REFERENCE, not instruction
# logic: extending it to a new jurisdiction never requires touching the rule
# text in modes/offer-prep.md. No script reads it — the agent does, as a
# LOCAL file lookup (which is not online research and does not touch
# offer-prep's no-research guard).
#
# WHY NO FLOOR VALUES OR DOCTRINE NARRATIVE (mandatory framing — read before
# editing or citing this file): employment-standards floors (vacation days,
# notice-period tables, severance formulas) and whole-provision-voiding
# doctrines (case names, holdings, the current post-case-law line) change —
# through amendment, indexation, and new case law — on a timeline this file
# cannot track. A stored number or doctrine summary looks verified and
# citable in a prompt even after it has gone stale, which hands the agent
# apparent authority it should never have over what the law currently says.
# So this table intentionally carries no floor VALUES and no doctrine
# NARRATIVE — only two structural flags per jurisdiction: which clause
# families (`floor_categories`) the jurisdiction is known to regulate with
# SOME statutory floor, and whether the jurisdiction has ANY doctrine
# (`void_doctrine`) under which a defect elsewhere in a termination
# provision can void the whole thing. Both flags exist only so
# modes/offer-prep.md knows WHEN to raise a lawyer question and about WHAT
# topic — never to answer the question itself. The actual current floor
# figure, and whether any doctrine applies to a specific contract, are
# always a lawyer question; this table never states either as fact.
#
# CONTRIBUTION RULE (mandatory): no entry lands in this table without
#   1. a regulator-grade citable source (statute text, official government
#      page, or a reputable law-firm bulletin) establishing that the
#      jurisdiction regulates the listed categories and/or has a
#      whole-provision-voiding doctrine, AND
#   2. an `as_of` date recording when the row was last verified.
# Unverified or "I heard that..." rows will be rejected in review. Seed
# narrow and verified; extend via community PRs — same discipline as the
# jurisdiction tables introduced for #2013/#2018/#2019/#2025/#2028.
#
# ABSENT-CATEGORY SEMANTICS (mandatory): a category is listed in
# `floor_categories` ONLY where the jurisdiction actually regulates it. An
# absent category — or an absent jurisdiction row — means the offer-prep
# check stays SILENT for that clause family. This is the designed "US case"
# (no federal vacation floor exists), not an omission: absence is
# meaningful. Never pad a row with a category inferred from a sibling
# jurisdiction, and never write "none"/"n/a" placeholder categories — omit
# the entry instead.
#
# NOT LEGAL ADVICE: these rows describe, at the flag level only, that
# published statutes and case law regulate a topic — never what they
# currently require, and never that any specific contract clause is void,
# unenforceable, illegal, or in violation of a statute. Employer size and
# payroll, employee-category exemptions, greater-right-or-benefit analysis,
# choice-of-law wrinkles, and the current point-in-time figure are exactly
# the things a contract document (and this table) cannot self-certify.
# Application to a specific clause is always a lawyer question.
#
# Schema per entry (list under `minimums`):
#   jurisdiction: string       — code, e.g. CA-ON, UK, DE, FR, JP
#   jurisdiction_name: string  — human-readable name for report output
#   floor_categories: list     — ONLY the clause families the jurisdiction is
#                                known to regulate with some statutory floor
#                                (any of: vacation, notice, severance,
#                                probation_limits) — category names only, no
#                                figures, no statutory text
#   void_doctrine: boolean     — true only if the jurisdiction has a known
#                                whole-provision-voiding doctrine for
#                                termination clauses; omit or false when none
#                                or unverified — no case names, holdings, or
#                                doctrine narrative are stored here
#   legal_basis: string        — the governing statute's NAME only (e.g.
#                                "Employment Standards Act, 2000 (Ontario)")
#                                — a pointer for the candidate's lawyer, never
#                                a section-level citation of a specific floor
#   sources: list               — citable texts/bulletins backing the flags
#   as_of: YYYY-MM-DD          — date this row was last verified against
#                                sources (quoted string — keep dates as
#                                strings)
#
# CANDIDATE ROWS FOR CONTRIBUTORS (suggestions only — do NOT add without the
# source + as_of discipline above; note the absence of figures below is
# deliberate — contributors add category/doctrine FLAGS, never values):
#   - UK : regulates notice and vacation categories.
#   - DE : regulates notice and vacation categories.
#   - FR : regulates vacation; note in `legal_basis` that sector-level
#          collective agreements (e.g. SYNTEC) routinely layer on top of the
#          statutory floor — a "check your convention collective" pointer,
#          not a computable category.
#   - EU : vacation category — the floor every member state builds on;
#          member-state rows should cite their own transposing statute.
#   - JP : vacation category (scales with tenure — still a flag, not a
#          value).
#   - US : federal — NO vacation category exists; deliberately ABSENT from
#          this table so the check stays silent (the designed behavior for
#          floor-less jurisdictions). State-level rows, where a state
#          regulates a category, would be keyed US-XX with their own
#          sources.

minimums:
  - jurisdiction: CA-ON
    jurisdiction_name: "Ontario, Canada"
    floor_categories:
      - vacation
      - notice
      - severance
      - probation_limits
    void_doctrine: true
    legal_basis: "Employment Standards Act, 2000, S.O. 2000, c. 41 (Ontario)"
    sources:
      - "Ontario Ministry of Labour, Immigration, Training and Skills Development — Employment Standards Act guide"
      - "Ontario Court of Appeal jurisprudence on termination-provision enforceability (case line verified with employment counsel, not stored here — see contribution rule above)"
    as_of: "2026-07-18"
